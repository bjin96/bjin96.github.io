  <p>
    Benjamin Jin is a doctoral researcher within the Medical Research Council's Precision Medicine Doctoral Training Programme
    at the University of Edinburgh. He holds bachelor's and master's degrees in computer science from the University of Augsburg, Germany.
    His research focuses on medical image analysis of routine clinical imaging for the prevention of neurovascular disease.
